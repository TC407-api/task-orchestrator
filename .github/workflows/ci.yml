name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6AM UTC

env:
  PYTHON_VERSION: "3.11"
  JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY_TEST }}

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system ruff pyright

      - name: Run Ruff linter
        run: ruff check src/ --output-format=github --ignore=F401

      - name: Run Ruff formatter check
        run: ruff format src/ --check
        continue-on-error: true

      - name: Run Pyright type checker
        run: pyright src/
        continue-on-error: true

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system pytest pytest-cov pytest-asyncio

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=70

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  test-plugins:
    name: Plugin Architecture Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system pytest pytest-asyncio

      - name: Run plugin tests
        run: pytest tests/test_plugins.py -v

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system bandit pip-audit

      - name: Run Bandit security linter
        run: bandit -r src/ -ll -ii -x tests/

      - name: Run pip-audit for CVE scanning
        run: pip-audit

      - name: Detect hardcoded credentials
        run: |
          echo "Scanning for hardcoded keys..."
          if grep -rn "sk-lf\|pk-lf\|AIzaSy\|sk-ant-\|sk-or-v1" src/ lib/ --include="*.py" | grep -v "\.pyc"; then
            echo "::error::Hardcoded credentials detected in source!"
            exit 1
          fi
          echo "No hardcoded credentials found."

  security-scheduled:
    name: Weekly Security Scan
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install and audit
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system pip-audit bandit
          pip-audit
          bandit -r src/ -ll -ii -x tests/

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint, test, test-plugins]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Verify MCP server starts
        run: |
          timeout 5 python -c "from src.mcp.server import TaskOrchestratorMCP; print('MCP server imports successfully')" || true

      - name: Verify plugin architecture
        run: |
          python -c "
          from src.mcp.plugins import PluginRegistry, PluginInterface
          from src.mcp.plugins.core_plugin import CorePlugin
          from src.license import LicenseValidator

          registry = PluginRegistry()
          registry.register(CorePlugin())
          tools = registry.get_all_tools()
          print(f'Core plugin loaded with {len(tools)} tools')

          validator = LicenseValidator()
          info = validator.validate('dev-all-features')
          print(f'License validation working: {info.is_valid}')
          "
